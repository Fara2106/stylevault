# Progetto Xcode generato: `cd ios && xcodegen generate` (il .xcodeproj non è in git)
name: StyleVault
options:
  bundleIdPrefix: it.faraoni
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  StyleVaultCore:
    path: StyleVaultCore
settings:
  base:
    # Apple Developer Program di Lorenzo (attivo dal 2026-11-05): firma automatica
    DEVELOPMENT_TEAM: 599MS2BZ63
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StyleVault:
    type: application
    platform: iOS
    sources: [StyleVault]
    # Avatar realistico: il calcolo sul telefono supera il limite di memoria standard
    entitlements:
      path: StyleVault/StyleVault.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.applesignin: [Default]
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    info:
      path: StyleVault/Info.plist
      properties:
        CFBundleDisplayName: StyleVault
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_KEY)
        SiteURL: $(SITE_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [stylevault]
        NSCameraUsageDescription: Per fare le foto del tuo corpo e dei capi.
        NSPhotoLibraryUsageDescription: Per scegliere le foto del tuo corpo e dei capi.
        NSLocationWhenInUseUsageDescription: Per mostrarti il meteo di dove sei e consigliarti cosa indossare.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Solo HTTPS di sistema: niente domanda sulla crittografia a ogni build
        ITSAppUsesNonExemptEncryption: false
        # Rete locale ed eccezione ATS per il dev server del Mac: SOLO in Debug,
        # le aggiunge lo script "Solo Debug: rete locale" qui sotto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.faraoni.stylevault
        TARGETED_DEVICE_FAMILY: "1"
        # Lo script Debug scrive nell'Info.plist già elaborato
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # La Release carica il sito pubblicato: l'IP di casa non deve finirci
        Release:
          SITE_URL: ""
    postBuildScripts:
      - name: "Solo Debug: rete locale"
        basedOnDependencyAnalysis: false
        script: |
          # Il dev server del Mac (vite --host) in rete locale: permesso e
          # eccezione ATS solo nelle build Debug, mai nella Release inviata.
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Solo in sviluppo: carica StyleVault dal Mac sulla rete di casa.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
    dependencies:
      - package: Supabase
  StyleVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StyleVaultTests
        excludes: [VisionTests.swift, AvatarRenderTests.swift, RealisticComposerTests.swift, Fixtures]
      # Fixture dell'avatar realistico (tokenizzatore, capo): cartella come risorsa
      - path: StyleVaultTests/Fixtures/realistic
        type: folder
    dependencies:
      - target: StyleVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # Vision (scontorno, posa) gira davvero solo su hardware Apple: i suoi test
  # stanno su macOS, che ha le stesse API e il Neural Engine del Mac.
  StyleVaultVisionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - StyleVault/Vision
      - StyleVault/Avatar/GarmentLayout.swift
      - StyleVault/Avatar/AvatarComposer.swift
      - StyleVault/Avatar/CutoutCache.swift
      - StyleVault/Avatar/RealisticComposer.swift
      - StyleVault/Realistic/GarmentMask.swift
      - StyleVault/Onboarding/BodyPhotosModel.swift
      - StyleVaultTests/VisionTests.swift
      - StyleVaultTests/AvatarRenderTests.swift
      - StyleVaultTests/RealisticComposerTests.swift
      - StyleVaultTests/Fixtures
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
  # Prova tecnica dell'avatar realistico: misura i modelli Core ML di
  # Mobile-VTON sull'iPhone. I .mlpackage (GB, licenza NC) non sono in git:
  # si copiano in RealisticBench/Models da tools/avatar-realistico/out/
  RealisticBench:
    type: application
    platform: iOS
    deploymentTarget: "18.0"  # i modelli sono convertiti per iOS 18
    # I modelli non vanno nel bundle: si copiano una volta in Documents/Models
    # (vedi tools/avatar-realistico/README.md), così reinstallare è veloce
    sources:
      - path: RealisticBench
        excludes: [Models]
      # Conti condivisi con l'app (stessa matematica della generazione)
      - path: StyleVault/Realistic/TryOnMath.swift
      - path: StyleVault/Realistic/TryOnTensors.swift
    entitlements:
      path: RealisticBench/RealisticBench.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: RealisticBench/Info.plist
      properties:
        CFBundleDisplayName: Bench
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.faraoni.stylevault.bench
        TARGETED_DEVICE_FAMILY: "1,2"  # anche l'iPad di Lorenzo
        COREML_CODEGEN_LANGUAGE: None
  RealisticBenchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources: [RealisticBenchTests]
    dependencies:
      - target: RealisticBench
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # La generazione Swift di RealisticBench sul Mac (vedi GenerationMacTests)
  RealisticBenchMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - StyleVault/Realistic/TryOnMath.swift
      - StyleVault/Realistic/TryOnTensors.swift
      - StyleVault/Realistic/TryOnInputs.swift
      - StyleVault/Realistic/CLIPTokenizer.swift
      - StyleVault/Realistic/GarmentCaption.swift
      - StyleVault/Realistic/RealisticTryOn.swift
      - StyleVault/Web/WebBridge.swift
      - RealisticBench/BenchGenerator.swift
      - RealisticBench/BenchRunner.swift
      - RealisticBench/BenchEstimate.swift
      - RealisticBenchMacTests
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
  # App nativa (SwiftUI + SwiftData + iCloud), accanto all'ibrida
  StyleVaultNative:
    type: application
    platform: iOS
    sources:
      - StyleVaultNative
      - StyleVault/Design/Palette.swift
      - StyleVault/App/ThemeStore.swift
    dependencies:
      - package: StyleVaultCore
    entitlements:
      path: StyleVaultNative/StyleVaultNative.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.it.faraoni.stylevault]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: StyleVaultNative/Info.plist
      properties:
        NSCameraUsageDescription: Per fotografare i tuoi capi.
        NSFaceIDUsageDescription: Serve per sbloccare l'app, se attivi il blocco nel Profilo.
        CFBundleDisplayName: SV Nativa
        CFBundleLocalizations: [it, en]
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.faraoni.stylevault.nativa
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
  StyleVaultNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StyleVaultNativeTests]
    dependencies:
      - target: StyleVaultNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StyleVaultNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StyleVaultNativeUITests]
    dependencies:
      - target: StyleVaultNative
    settings:
      base:
        TEST_TARGET_NAME: StyleVaultNative
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StyleVaultNative:
    build:
      targets:
        StyleVaultNative: all
    test:
      targets: [StyleVaultNativeTests, StyleVaultNativeUITests]
  RealisticBenchMac:
    build:
      targets:
        RealisticBenchMacTests: [test]
    test:
      targets: [RealisticBenchMacTests]
  RealisticBench:
    build:
      targets:
        RealisticBench: all
    test:
      targets: [RealisticBenchTests]
  StyleVault:
    build:
      targets:
        StyleVault: all
    test:
      targets: [StyleVaultTests]
  StyleVaultVisionTests:
    build:
      targets:
        StyleVaultVisionTests: [test]
    test:
      targets: [StyleVaultVisionTests]
