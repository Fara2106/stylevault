# Progetto Xcode generato: `cd ios && xcodegen generate` (il .xcodeproj non è in git)
name: StyleVault
options:
  bundleIdPrefix: it.faraoni
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settings:
  base:
    # Team personale di Lorenzo (Apple ID gratuito): firma automatica
    DEVELOPMENT_TEAM: 599MS2BZ63
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StyleVault:
    type: application
    platform: iOS
    sources: [StyleVault]
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    info:
      path: StyleVault/Info.plist
      properties:
        CFBundleDisplayName: StyleVault
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_KEY)
        SiteURL: $(SITE_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [stylevault]
        NSCameraUsageDescription: Per fare le foto del tuo corpo e dei capi.
        NSPhotoLibraryUsageDescription: Per scegliere le foto del tuo corpo e dei capi.
        NSLocalNetworkUsageDescription: In sviluppo l'app carica StyleVault dal Mac sulla rete di casa.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.faraoni.stylevault
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Supabase
  StyleVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StyleVaultTests
        excludes: [VisionTests.swift, AvatarRenderTests.swift, Fixtures]
    dependencies:
      - target: StyleVault
  # Vision (scontorno, posa) gira davvero solo su hardware Apple: i suoi test
  # stanno su macOS, che ha le stesse API e il Neural Engine del Mac.
  StyleVaultVisionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - StyleVault/Vision
      - StyleVault/Avatar/GarmentLayout.swift
      - StyleVault/Avatar/AvatarComposer.swift
      - StyleVault/Onboarding/BodyPhotosModel.swift
      - StyleVaultTests/VisionTests.swift
      - StyleVaultTests/AvatarRenderTests.swift
      - StyleVaultTests/Fixtures
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StyleVault:
    build:
      targets:
        StyleVault: all
    test:
      targets: [StyleVaultTests]
  StyleVaultVisionTests:
    build:
      targets:
        StyleVaultVisionTests: [test]
    test:
      targets: [StyleVaultVisionTests]
